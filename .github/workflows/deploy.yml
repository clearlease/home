name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild at 03:15 Berlin time (01:15 UTC in summer), so content with an `until`
  # date (EXPO news, time-limited tips) drops out without a manual deploy.
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run build
      - run: npm run check:copy
      - run: npm run test:unit
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
